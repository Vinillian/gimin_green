<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌾 ПШЕНИЧНАЯ ФЕРМА</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Левая панель с кнопками -->
    <div class="sidebar">
        <!-- Кнопки добавления ресурсов -->
        <div class="resources-buttons">
            <button class="resource-add-btn water" id="addWaterBtn">🚰 +5 ВОДЫ</button>
            <button class="resource-add-btn solution" id="addSolutionBtn">🧪 +4 РАСТВОРА</button>
            <button class="resource-add-btn seeds" id="addSeedsBtn">🌱 +10 СЕМЯН</button>
        </div>

        <!-- Кнопки добавления контейнеров -->
        <button class="btn btn-primary btn-block" id="newBatch1Btn">
            <span>🌱</span> +1 КОНТЕЙНЕР
        </button>
        <button class="btn btn-warning btn-block" id="newBatch4Btn">
            <span>⚡</span> +4 КОНТЕЙНЕРА
        </button>

        <div class="section-title">УПРАВЛЕНИЕ СТАДИЯМИ</div>
        
        <button class="btn btn-stage soak" id="stageSoakBtn">
            <span>💧</span> ЗАМАЧИВАНИЕ
        </button>
        <button class="btn btn-stage air" id="stageAirBtn">
            <span>🌬</span> ПРОВЕТРИВАНИЕ
        </button>
        <button class="btn btn-stage sow" id="stageSowBtn">
            <span>🌱</span> ПОСЕВ
        </button>
        <button class="btn btn-stage press" id="stagePressBtn">
            <span>📦</span> ПРИЖИМ
        </button>
        <button class="btn btn-stage light" id="stageLightBtn">
            <span>💡</span> НА СВЕТ
        </button>
        <button class="btn btn-stage reset" id="resetStageBtn">
            <span>🔄</span> СБРОС
        </button>

        <div class="section-title">ВЫДЕЛЕНИЕ</div>

        <div class="action-grid">
            <button class="btn btn-blue" id="selectAllBtn">
                <span>🔲</span> ВЫБРАТЬ ВСЕ
            </button>
            <button class="btn btn-purple" id="clearSelectionBtn">
                <span>❌</span> СНЯТЬ ВСЕ
            </button>
        </div>

        <div class="section-title">ДЕЙСТВИЯ</div>

        <div class="action-grid">
            <button class="btn btn-success" id="harvestSelectedBtn">
                <span>✂️</span> СОБРАТЬ
            </button>
            <button class="btn btn-danger" id="deleteSelectedBtn">
                <span>🗑️</span> УДАЛИТЬ
            </button>
        </div>

        <div class="selected-info" id="selectedInfo">
            👆 Нажми на контейнер, чтобы выбрать
        </div>
    </div>

    <!-- Правая панель с поддонами -->
    <div class="main-content">
        <!-- Верхняя панель с ресурсами -->
        <div class="top-resources">
            <div class="resource-card large">                
                <span class="resource-icon">💧</span>
                <span class="resource-label">ВОДА</span>
                <span class="resource-value" id="waterCount">20</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">🧪</span>
                <span class="resource-label">РАСТВОР</span>
                <span class="resource-value" id="solutionCount">15</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">🌱</span>
                <span class="resource-label">СЕМЕНА</span>
                <span class="resource-value" id="seedCount">30</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">📦</span>
                <span class="resource-label">КОНТЕЙНЕРЫ</span>
                <span class="resource-value" id="totalContainers">0</span>/20
            </div>
        </div>

        <div class="pallets-container">
            <!-- Первый поддон -->
            <div class="pallet-wrapper">
                <div class="pallet-header">
                    <span>🌾 ПОДДОН 1</span>
                    <span>✅ <span id="readyCount1">0</span> | ⏳ <span id="inProgressCount1">0</span></span>
                </div>
                <div class="pallet">
                    <div class="pallet-grid" id="containerGrid1"></div>
                </div>
            </div>

            <!-- Второй поддон -->
            <div class="pallet-wrapper">
                <div class="pallet-header">
                    <span>🌾 ПОДДОН 2</span>
                    <span>✅ <span id="readyCount2">0</span> | ⏳ <span id="inProgressCount2">0</span></span>
                </div>
                <div class="pallet">
                    <div class="pallet-grid" id="containerGrid2"></div>
                </div>
            </div>
        </div>

        <div class="log-panel" id="logPanel">
            📋 Добро пожаловать в тестовую ферму!
        </div>
    </div>
</div>

<script src="constants.js"></script>
<script src="state.js"></script>
<script src="containerManager.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
