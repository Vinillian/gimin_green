<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌾 ПШЕНИЧНАЯ ФЕРМА</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Левая панель с кнопками -->
    <div class="sidebar">
        <!-- Кнопки добавления ресурсов -->
        <div class="resources-buttons">
            <button class="resource-add-btn water" id="addWaterBtn">🚰 +5 ВОДЫ</button>
            <button class="resource-add-btn solution" id="addSolutionBtn">🧪 +4 РАСТВОРА</button>
            <button class="resource-add-btn seeds" id="addSeedsBtn">🌱 +10 СЕМЯН</button>
        </div>

        <!-- Кнопки добавления семян в вёдра -->
        <button class="btn btn-primary btn-block" id="newBatch1Btn">
            <span>🌱</span> +1 СЕМЯ В ВЕДРО
        </button>
        <button class="btn btn-warning btn-block" id="newBatch4Btn">
            <span>⚡</span> +4 СЕМЯН В ВЕДРО
        </button>

        <div class="section-title">УПРАВЛЕНИЕ СТАДИЯМИ</div>
        
        <button class="btn btn-stage soak" id="stageSoakBtn">
            <span>💧</span> ЗАМАЧИВАНИЕ
        </button>
        <button class="btn btn-stage air" id="stageAirBtn">
            <span>🌬</span> ПРОВЕТРИВАНИЕ
        </button>
        <button class="btn btn-stage sow" id="stageSowBtn">
            <span>🌱</span> ПОСЕВ
        </button>
        <button class="btn btn-stage press" id="stagePressBtn">
            <span>📦</span> ПРИЖИМ
        </button>
        <button class="btn btn-stage light" id="stageLightBtn">
            <span>💡</span> НА СВЕТ
        </button>
        <button class="btn btn-stage reset" id="resetStageBtn">
            <span>🔄</span> СБРОС ВЫБОРА
        </button>

        <div class="section-title">УХОД</div>
        
        <div class="double-action-row">
            <button class="btn btn-info" id="spraySelectedBtn">
                <span>💦</span> ОПРЫСКАТЬ
            </button>
            <button class="btn btn-water" id="waterSelectedBtn">
                <span>🚰</span> ПОЛИТЬ
            </button>
        </div>

        <div class="section-title">ВЫДЕЛЕНИЕ</div>

        <div class="action-grid">
            <button class="btn btn-blue" id="selectAllBtn">
                <span>🔲</span> ВСЕ
            </button>
            <button class="btn btn-purple" id="clearSelectionBtn">
                <span>❌</span> СНЯТЬ
            </button>
        </div>

        <div class="section-title">ДЕЙСТВИЯ</div>

        <div class="action-grid">
            <button class="btn btn-success" id="harvestSelectedBtn">
                <span>✂️</span> СОБРАТЬ
            </button>
            <button class="btn btn-danger" id="deleteSelectedBtn">
                <span>🗑️</span> УДАЛИТЬ
            </button>
        </div>

        <div class="selected-info" id="selectedInfo">
            👆 Нажми на контейнер или ведро
        </div>
    </div>

    <!-- Правая панель -->
    <div class="main-content">
        <!-- Верхняя панель с ресурсами -->
        <div class="top-resources">
            <div class="resource-card large">
                <span class="resource-icon">💧</span>
                <span class="resource-label">ВОДА</span>
                <span class="resource-value" id="waterCount">20</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">🧪</span>
                <span class="resource-label">РАСТВОР</span>
                <span class="resource-value" id="solutionCount">15</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">🌱</span>
                <span class="resource-label">СЕМЕНА</span>
                <span class="resource-value" id="seedCount">30</span>
            </div>
            <div class="resource-card large">
                <span class="resource-icon">📦</span>
                <span class="resource-label">КОНТ.</span>
                <span class="resource-value" id="totalContainers">0</span>/20
            </div>
        </div>

        <!-- Рабочая область -->
        <div class="workspace">
            <!-- Левая колонка - поддоны -->
            <div class="pallets-column">
                <div class="pallet-wrapper">
                    <div class="pallet-header">
                        <span>🌾 ПОДДОН 1 (1-8)</span>
                        <span>✅ <span id="readyCount1">0</span></span>
                    </div>
                    <div class="pallet">
                        <div class="pallet-grid" id="containerGrid1"></div>
                    </div>
                </div>
                <div class="pallet-wrapper">
                    <div class="pallet-header">
                        <span>🌾 ПОДДОН 2 (9-16)</span>
                        <span>✅ <span id="readyCount2">0</span></span>
                    </div>
                    <div class="pallet">
                        <div class="pallet-grid" id="containerGrid2"></div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка - процессы -->
            <div class="processes-column">
                <!-- Вёдра -->
                <div class="zone">
                    <div class="zone-header">💧 ЗАМАЧИВАНИЕ / ПРОВЕТРИВАНИЕ</div>
                    <div class="buckets-container" id="bucketsContainer"></div>
                </div>

                <!-- Двойная зона: посев + прижим -->
                <div class="double-zone">
                    <!-- Посев -->
                    <div class="sowing-zone zone">
                        <div class="zone-header">🌱 ПОСЕВ (2x4)</div>
                        <div class="table-container" id="tableContainer"></div>
                    </div>

                    <!-- Прижим -->
                    <div class="press-zone zone">
                        <div class="zone-header">📦 ПРИЖИМ (стопки по 4)</div>
                        <div class="shelves-container">
                            <div class="shelf">
                                <div class="shelf-header">ПОЛКА 1</div>
                                <div class="shelf-vertical" id="shelf1Container"></div>
                            </div>
                            <div class="shelf">
                                <div class="shelf-header">ПОЛКА 2</div>
                                <div class="shelf-vertical" id="shelf2Container"></div>
                            </div>
                            <div class="shelf">
                                <div class="shelf-header">ПОЛКА 3</div>
                                <div class="shelf-vertical" id="shelf3Container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="log-panel" id="logPanel">
            📋 Добро пожаловать в ферму!
        </div>
    </div>
</div>

<script src="constants.js"></script>
<script src="state.js"></script>
<script src="containerManager.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
